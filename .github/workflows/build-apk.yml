name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          cmake \
          gettext \
          zip \
          unzip \
          openjdk-17-jdk \
          pkg-config

    - name: Install Fixed Python Tools
      run: |
        python -m pip install --upgrade "pip<24.1" "setuptools<69.0.0"
        pip install "cython<3.0.0" buildozer

    - name: Accept Android SDK licenses
      run: |
        yes | buildozer android debug || true

    - name: Build with Buildozer
      run: |
        export P4A_PIP_BUILD_ON_BUILD=0
        buildozer android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
